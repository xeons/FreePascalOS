lucida grande = DejaVu Sans
georgia = Noto Serif, Liberation Serif
cambria = Noto Serif, Liberation Serif
consolas = Inconsolata, Liberation Mono
menlo = DejaVu Sans Mono
monaco = DejaVu Sans Mono
sf mono = DejaVu Sans Mono
lucida console = Liberation Mono
bitstream vera sans = DejaVu Sans
bitstream vera sans mono = DejaVu Sans Mono
source sans pro = Source Sans 3
noto sans cjk jp = Noto Sans CJK
noto sans cjk sc = Noto Sans CJK
noto sans cjk tc = Noto Sans CJK
noto sans cjk kr = Noto Sans CJK
noto sans jp = Noto Sans CJK
noto sans sc = Noto Sans CJK
ms gothic = Noto Sans CJK, Droid Sans Fallback
ms mincho = Noto Sans CJK, Droid Sans Fallback
meiryo = Noto Sans CJK, Droid Sans Fallback
