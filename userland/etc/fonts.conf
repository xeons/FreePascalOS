# The system's font configuration (Font.Configuration): which installed
# families stand for the generic families and the font names documents
# ask for, and which families are tried for a character the chosen
# font lacks. A family is a directory in /lib/fonts named after it in
# lower case with dashes ("Liberation Sans" is liberation-sans); the
# first one installed in a list is taken.
#
# The interface keeps its own font (DejaVu Sans, Windowing.Theme);
# this file decides what web pages and character fallback get.

[families]
# Generic families.
sans-serif = Liberation Sans, DejaVu Sans
serif = Liberation Serif, DejaVu Serif, DejaVu Sans
monospace = Liberation Mono, DejaVu Sans Mono
ui-monospace = DejaVu Sans Mono
system-ui = DejaVu Sans
ui-sans-serif = DejaVu Sans
ui-serif = DejaVu Serif, Liberation Serif
ui-rounded = DejaVu Sans
cursive = Z003, DejaVu Sans
fantasy = URW Gothic, DejaVu Sans
emoji = Noto Color Emoji, Noto Sans Symbols 2
math = Noto Sans Math, DejaVu Sans
fangsong = Noto Sans CJK, Droid Sans Fallback

# Metric-compatible stand-ins for common fonts.
arial = Liberation Sans, Nimbus Sans
helvetica = Liberation Sans, Nimbus Sans
helvetica neue = Liberation Sans, Nimbus Sans
arial narrow = Nimbus Sans Narrow, Liberation Sans
times = Liberation Serif, Nimbus Roman
times new roman = Liberation Serif, Nimbus Roman
courier = Liberation Mono, Nimbus Mono PS
courier new = Liberation Mono, Nimbus Mono PS
palatino = P052, Liberation Serif
palatino linotype = P052, Liberation Serif
book antiqua = P052, Liberation Serif
new century schoolbook = C059, Liberation Serif
century schoolbook = C059, Liberation Serif
bookman = URW Bookman, Liberation Serif
bookman old style = URW Bookman, Liberation Serif
avant garde = URW Gothic, Liberation Sans
itc avant garde gothic = URW Gothic, Liberation Sans
zapf chancery = Z003
symbol = Standard Symbols PS
zapf dingbats = D050000L

# Other familiar names, by likeness.
verdana = DejaVu Sans
tahoma = DejaVu Sans
segoe ui = Noto Sans, Liberation Sans
-apple-system = DejaVu Sans
blinkmacsystemfont = DejaVu Sans
sf pro text = Noto Sans, Liberation Sans
