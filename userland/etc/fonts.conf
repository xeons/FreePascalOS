simsun = Noto Sans CJK, Droid Sans Fallback
simhei = Noto Sans CJK, Droid Sans Fallback
microsoft yahei = Noto Sans CJK, Droid Sans Fallback
pingfang sc = Noto Sans CJK, Droid Sans Fallback
malgun gothic = Noto Sans CJK, Droid Sans Fallback
apple color emoji = Noto Color Emoji
segoe ui emoji = Noto Color Emoji
segoe ui symbol = Noto Sans Symbols 2, Noto Sans Symbols
noto emoji = Noto Color Emoji

[fallback]
# Tried in order for any character, after its script's families.
default = DejaVu Sans, Noto Sans, Liberation Sans, DejaVu Serif, Noto Sans Symbols, Noto Sans Symbols 2, Noto Sans Math, DejaVu Sans Mono, Noto Sans CJK, Droid Sans Fallback, Noto Color Emoji

