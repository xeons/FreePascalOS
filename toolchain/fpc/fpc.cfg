#
# Free Pascal on FreePascalOS: the configuration of the native compiler
# (/etc/fpc.cfg). The compiler reads it after ~/.fpc.cfg and ./fpc.cfg.
#

# The logo, and the files being compiled and linked, with warnings and
# notes.
-l
-viwn

# The units: the runtime library in rtl, the system's own libraries in
# a folder each (system for libsystem's Sys.* units, cryptography,
# coreutils, ...).
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget/*

# Units whose code is in a library (the runtime library and Sys.* in
# libsystem.so, the others in lib<folder>.so) are linked against that
# library in /lib instead of being copied into the program.
-XD
-Fl/lib

# Every routine keeps its frame pointer, so runtime errors and crash
# reports can walk the frames for a back trace.
-OoNOSTACKFRAME

#ifdef CPUAARCH64
# AArch64 processors set flags instead of trapping floating point
# exceptions: the compiler checks them after each operation, as the
# system's own programs do.
-CE
#endif
