<!-- width=400 -->
<html><head><style>
body { margin: 0; font: 16px sans-serif; }
.arrow { width: 10px; height: 10px; margin: 3px 2px 6px; background: #f60; }
</style></head>
<body>
<!-- No doctype (quirks mode), as news.ycombinator.com: <center> centres
     a table (text-align: -webkit-center), and the lines around a block
     inside a link (the link's start and end, nothing else) take no
     height, so the cell is the arrow's 19px and the title beside it is
     not pushed down. -->
<center><table width="50%" cellpadding=0 cellspacing=0><tr>
<td valign=top><center><a href="#"><div class=arrow></div></a></center></td>
<td>Title</td></tr></table></center>
<!-- The same in a div with text-align: -webkit-center. -->
<div style="text-align:-webkit-center"><table style="width:100px" cellpadding=0 cellspacing=0><tr><td>x</td></tr></table></div>
<!-- An empty span alone on a line: no height. -->
<div style="background:#def"><span></span></div>
<div style="background:#fed">after</div>
</body></html>
