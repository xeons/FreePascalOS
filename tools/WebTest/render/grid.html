<!-- width=500 -->
<!doctype html>
<html><head><style>
body { margin: 8px; font: 14px sans-serif; }
.g { display: grid; background: #eee; margin-bottom: 10px; gap: 4px; }
.g > div { background: #cdf; border: 1px solid #369; }
.fixed { grid-template-columns: 100px 1fr 2fr; }
.repeat { grid-template-columns: repeat(3, 1fr); }
.autofill { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
.auto { grid-template-columns: auto auto 1fr; }
.span > div:first-child { grid-column: span 2; }
.lines > .a { grid-column: 2 / 4; grid-row: 1; }
.lines > .b { grid-column: 1; grid-row: 1 / 3; }
.areas { grid-template-columns: 120px 1fr; grid-template-rows: auto 60px auto;
  grid-template-areas: "head head" "side main" "foot foot"; }
.areas .head { grid-area: head; } .areas .side { grid-area: side; }
.areas .main { grid-area: main; } .areas .foot { grid-area: foot; }
.align { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 50px; align-items: center; justify-items: center; }
.column { grid-auto-flow: column; grid-template-rows: repeat(2, auto); }
.height { grid-template-rows: 1fr 2fr; height: 90px; grid-template-columns: 1fr 1fr; }
</style></head>
<body>
<div class="g fixed"><div>100px</div><div>1fr</div><div>2fr</div></div>
<div class="g repeat"><div>one</div><div>two</div><div>three</div><div>four</div></div>
<div class="g autofill"><div>a</div><div>b</div><div>c</div><div>d</div><div>e</div></div>
<div class="g auto"><div>auto</div><div>longer auto</div><div>rest</div></div>
<div class="g repeat span"><div>spans two</div><div>x</div><div>y</div><div>z</div></div>
<div class="g repeat lines"><div class=a>columns 2 to 4</div><div class=b>rows 1 to 3</div><div>auto</div><div>auto</div></div>
<div class="g areas"><div class=head>Header</div><div class=side>Side</div><div class=main>Main</div><div class=foot>Footer</div></div>
<div class="g align"><div>centered</div><div>in</div><div>areas</div></div>
<div class="g column"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>
<div class="g height"><div>1fr</div><div>1fr</div><div>2fr</div><div>2fr</div></div>
</body></html>
