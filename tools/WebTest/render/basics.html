<!doctype html>
<html><head><style>
body { margin: 10px; font: 16px sans-serif; }
.box { width: 200px; padding: 5px; border: 2px solid red; margin: 20px auto; }
p { margin: 10px 0; }
.f { float: left; width: 50px; height: 50px; }
</style></head>
<body>
<h1>Hello world</h1>
<div class=box>Some <b>bold</b> text that wraps across a couple of lines in a narrow box.</div>
<p><span class=f></span>Float beside this text which should wrap around the float nicely when long enough.</p>
<ul><li>One</li><li>Two</li></ul>
<table border=1><tr><td>a</td><td>bb</td></tr><tr><td colspan=2>wide cell</td></tr></table>
<div style="display:flex; gap: 10px"><div style="flex:1">A</div><div style="flex:2">B</div></div>
</body></html>
