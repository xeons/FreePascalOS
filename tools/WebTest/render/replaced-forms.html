<!doctype html>
<html><head><style>
body { margin: 8px; font: 14px sans-serif; }
.frame { border: 1px solid; }
</style></head>
<body>
<p>An image with only width and height attributes: <img width=40 height=30 class=frame alt=""> inline.</p>
<p>Width only, no image: <img width=50 class=frame alt=""> and a block image:</p>
<img style="display:block; width: 60px; height: 20px" class=frame alt="">
<p>Default replaced sizes: <canvas class=frame></canvas></p>
<p><iframe style="width: 120px; height: 40px"></iframe> iframe</p>
<p>Text field <input value="hello"> and <input type=checkbox checked> check <input type=radio> radio.</p>
<p><button>Button</button> <input type=submit> <select><option>First</option><option selected>Chosen</option></select></p>
<p><textarea cols=10 rows=2>Area</textarea> <meter value=0.5></meter> <progress></progress></p>
<p style="vertical-align: middle">Middle <img width=20 height=20 class=frame style="vertical-align: middle" alt=""> aligned.</p>
</body></html>
