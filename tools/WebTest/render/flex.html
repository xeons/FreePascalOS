<!doctype html>
<html><head><style>
body { margin: 8px; font: 14px sans-serif; }
.f { display: flex; background: #eee; margin-bottom: 8px; }
.f > div { background: #cdf; border: 1px solid #369; }
.grow > div:nth-child(1) { flex: 1; }
.grow > div:nth-child(2) { flex: 2; }
.grow > div:nth-child(3) { width: 100px; }
.shrink > div { width: 200px; flex-shrink: 1; }
.shrink > div:first-child { flex-shrink: 3; }
.wrap { flex-wrap: wrap; gap: 4px 6px; width: 300px; }
.wrap > div { width: 90px; height: 20px; }
.justify { justify-content: space-between; }
.center { justify-content: center; align-items: center; height: 60px; }
.end { justify-content: flex-end; align-items: flex-end; height: 40px; }
.column { flex-direction: column; height: 120px; }
.column > div:nth-child(2) { flex: 1; }
.reverse { flex-direction: row-reverse; }
.order > div:first-child { order: 2; }
.auto > div:last-child { margin-left: auto; }
.baseline { align-items: baseline; }
.baseline > div:first-child { font-size: 24px; }
.stretch > div { min-height: 10px; }
.inline { display: inline-flex; background: #ffd; }
</style></head>
<body>
<div class="f grow"><div>one</div><div>two</div><div>three</div></div>
<div class="f shrink"><div>shrinks three times</div><div>shrinks once</div><div>shrinks once</div></div>
<div class="f wrap"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>
<div class="f justify"><div>left</div><div>middle</div><div>right</div></div>
<div class="f center"><div>centered</div><div style="height:30px">tall</div></div>
<div class="f end"><div>end</div><div>end</div></div>
<div class="f column"><div>top</div><div>grows</div><div>bottom</div></div>
<div class="f reverse"><div>first</div><div>second</div><div>third</div></div>
<div class="f order"><div>first in source</div><div>second</div></div>
<div class="f auto"><div>a</div><div>pushed right</div></div>
<div class="f baseline"><div>Big</div><div>small baseline</div></div>
<div class="f stretch" style="height: 50px"><div>stretched</div><div style="align-self: flex-start">start</div></div>
<p>Text with an <span class=inline><span>inline</span><span>flex</span></span> container.</p>
<div class=f>Anonymous text item<div>element item</div></div>
</body></html>
