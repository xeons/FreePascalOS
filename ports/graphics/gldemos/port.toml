# The system's own OpenGL test and demonstration programs, kept in the
# port's files/ and built against the mesa port's libraries.

[port]
name = "gldemos"
version = "1.0"
revision = 0
summary = "OpenGL and OpenGL ES tests and demonstrations"
description = """
gltest checks Mesa without a window system: OpenGL ES 2, OpenGL ES 1.1
and desktop OpenGL contexts on EGL's surfaceless platform, drawing and
reading pixels back.
"""
homepage = "https://www.mesa3d.org/"
license = "GPL-3.0-or-later"
license_files = ["port:files/COPYING"]
maintainer = "FreePascalOS ports"
categories = ["graphics"]
status = "untested"
architectures = ["x86_64", "aarch64"]

[dependencies]
build = ["mesa"]
run = ["mesa"]

[build]
system = "custom"
toolchain = "c"

[build.steps]
build = [
    "$CC $CFLAGS $LDFLAGS -Wall -o gltest ${FILES}/gltest.c -lEGL -lGLESv2",
]
install = [
    "mkdir -p ${STAGE}${PREFIX}/bin",
    "install -m 0755 gltest ${STAGE}${PREFIX}/bin/gltest",
]

[test]
system = ["gltest"]
