# Lua, a small C program and library built with its own Makefile. The
# "generic" platform is plain ISO C (no dlopen, no readline), the least
# the C library has to give. Untested: it waits for the C toolchain.

[port]
name = "lua"
version = "5.4.9"
revision = 0
summary = "Small embeddable scripting language"
description = """
Lua is a powerful, efficient, lightweight, embeddable scripting
language: procedural, object-oriented, functional and data-driven
programming with associative arrays and extensible semantics. This port
installs the lua interpreter, the luac compiler, the static library and
its headers, built for Lua's generic (ISO C) platform.
"""
homepage = "https://www.lua.org/"
license = "MIT"
license_files = ["port:files/LICENSE"]
maintainer = "FreePascalOS ports"
categories = ["lang"]
status = "untested"
architectures = ["x86_64", "aarch64"]

[[sources]]
url = "https://www.lua.org/ftp/lua-5.4.9.tar.gz"
sha256 = "2335b6c582a52654f94612bf10d2f4672805d05329aa6568b1d8cd9e5c6fb8e6"
size = 373429
extract_dir = "lua-5.4.9"

[dependencies]
host = ["make"]
provides = ["liblua"]

[build]
system = "custom"
toolchain = "c"

[build.steps]
build = [
    "make -j${JOBS} -C src generic CC=\"$CC -std=gnu99\" AR=\"$AR rcu\" RANLIB=\"$RANLIB\" MYCFLAGS=\"$CFLAGS\" MYLDFLAGS=\"$LDFLAGS\"",
]
install = ["make install INSTALL_TOP=${STAGE}${PREFIX}"]

[test]
system = ["lua -e 'print(6 * 7)' | grep -qx 42", "echo 'return 1' > /tmp/t.lua && luac -o /tmp/t.luac /tmp/t.lua && lua /tmp/t.luac"]
