# zlib, the first C library: built static with the cross toolchain
# (make c-toolchain). zlib's configure is its own (not autoconf): it
# takes the target from CHOST and the compiler from CC. Untested: it
# waits for the C toolchain and mlibc.

[port]
name = "zlib"
version = "1.4"
revision = 0
summary = "Lossless data compression library (deflate, zlib and gzip formats)"
description = """
zlib is a general purpose data compression library implementing the
deflate format (RFC 1951) with the zlib (RFC 1950) and gzip (RFC 1952)
wrappers. This port installs the static library, its headers, the
pkg-config file and the manual page, for other ports to build against.
"""
homepage = "https://zlib.net/"
license = "Zlib"
license_files = ["LICENSE"]
maintainer = "FreePascalOS ports"
categories = ["archivers", "devel"]
status = "untested"
architectures = ["x86_64", "aarch64"]

[[sources]]
url = "https://zlib.net/zlib-1.4.tar.xz"
mirrors = ["https://github.com/madler/zlib/releases/download/v1.4/zlib-1.4.tar.xz"]
sha256 = "4f11c512053d7bab8d9e9b89bde3575add3e4c50a383b42ef6cb837035fc5a7c"
size = 1320316
extract_dir = "zlib-1.4"
signature = { url = "https://zlib.net/zlib-1.4.tar.xz.asc", type = "gpg", key = "zlib-signing-key.gpg" }

[dependencies]
host = ["make"]
provides = ["libz"]

[build]
system = "custom"
toolchain = "c"

[build.steps]
configure = ["CHOST=${TRIPLET} ./configure --prefix=${PREFIX} --static"]
build = ["make -j${JOBS} libz.a"]
install = ["make DESTDIR=${STAGE} install"]

[test]
system = ["test -f /usr/local/lib/libz.a", "test -f /usr/local/include/zlib.h"]
