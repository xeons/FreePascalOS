# Doom, from doomgeneric: id Software's Doom source (by way of Chocolate
# Doom) made portable behind a few platform functions, which
# files/doomgeneric_freepascalos.c implements on the display server's
# windows. The package is named after the engine, which has no releases
# (a pinned commit, versioned 0.0.DATE of that commit), so that other
# Doom engines can be ported beside it; the program is "doom". Game
# data is not part of it: the freedoom port installs Freedoom's IWADs
# where it looks for them. The music is Chocolate Doom's OPL player and
# emulator, from a second source (Chocolate Doom's release).

[port]
name = "doomgeneric"
version = "0.0.20261011"
revision = 1
summary = "Doom, the 1993 first-person shooter, in a window"
description = """
doomgeneric is id Software's Doom engine (as Chocolate Doom keeps it,
faithful to the original game) made portable: the FreePascalOS platform
layer shows it in a resizable window of the display server, its 320x200
frame scaled to the window at Doom's 4:3 shape and the display's scale,
reads the keyboard, and plays the sound effects and the music through
/dev/audio. The music is Doom's as an AdLib or a Sound Blaster played
it: FM synthesis on an emulated OPL3 chip (Chocolate Doom's OPL player
and its Nuked OPL3 emulator) with the instruments of the WAD's GENMIDI
lump.

The program is doom. It needs an IWAD (the game's data): it looks in
the current folder, the folder DOOMWADDIR names, the folders of
DOOMWADPATH, /usr/local/share/games/doom and /usr/share/games/doom. The
freedoom package puts Freedoom Phase 1 and Phase 2 there; doom starts
Phase 1, doom -iwad freedoom2.wad the other. A Doom IWAD of your own
(doom.wad, doom2.wad, ...) dropped into /usr/local/share/games/doom is
found too, and is preferred to Freedoom.

Keys: arrows move and turn, Ctrl fires, Space uses (doors, switches),
Shift runs, Alt strafes, Tab shows the map, 1-7 choose weapons, Escape
opens the menu, Enter and Y/N answer it. Music Volume in the menu's
Options, Sound Volume sets the music's volume; snd_musicdevice 0 in ~/.doom/default.cfg (or
doom -nomusic) turns the music off, snd_dmxoption "" in
~/.doom/doomgenericdoom.cfg makes it an OPL2's (an AdLib's: mono, 9
voices) rather than an OPL3's.
"""
homepage = "https://github.com/ozkl/doomgeneric"
license = "GPL-2.0-or-later AND GPL-3.0-or-later"
license_files = ["LICENSE", "chocolate-doom/chocolate-doom-chocolate-doom-3.1.1/COPYING.md", "port:files/COPYING"]
maintainer = "FreePascalOS ports"
categories = ["games"]
status = "untested"
architectures = ["x86_64", "aarch64"]
notes = """
doomgeneric is GPL-2.0-or-later. The music files compiled from
Chocolate Doom 3.1.1 (src/i_oplmusic.c, src/midifile.c, opl/opl.c,
opl/opl_queue.c, and opl/opl3.c, the Nuked OPL3 emulator by Alexey
Khokholov, in the GPL-2.0-or-later version Chocolate Doom carries) are
GPL-2.0-or-later too. The platform layer in files/ (with its OPL driver,
which replaces Chocolate Doom's SDL one) is GPL-3.0-or-later, so the
program built from all of them is distributed under GPL-3.0. doomgeneric
has no releases: its source is a pinned commit's archive; Chocolate
Doom's is the archive of its release tag. Recommends freedoom (game
data) but does not depend on it: any IWAD will do.
"""

[[sources]]
url = "https://github.com/ozkl/doomgeneric/archive/e257a09527062bfb986b6e5e0780839b6cbd5b71.tar.gz"
filename = "doomgeneric-e257a09527062bfb986b6e5e0780839b6cbd5b71.tar.gz"
sha256 = "26f8f60daa6c6e4d3c01e5eac9fb700d592dede803d13ac848154ff356b2a2e7"
size = 3090826
extract_dir = "doomgeneric-e257a09527062bfb986b6e5e0780839b6cbd5b71"

# Chocolate Doom's OPL music (src/i_oplmusic.c, src/midifile.c and the
# opl/ library with the Nuked OPL3 emulator): the release tag's archive,
# unpacked inside doomgeneric's tree so the patches reach it. Only those
# files are compiled (Makefile.freepascalos); its SDL driver is replaced
# by files/opl_freepascalos.c.
[[sources]]
url = "https://github.com/chocolate-doom/chocolate-doom/archive/refs/tags/chocolate-doom-3.1.1.tar.gz"
filename = "chocolate-doom-3.1.1.tar.gz"
sha256 = "1edcc41254bdc194beb0d33e267fae306556c4d24110a1d3d3f865717f25da23"
size = 2257534
extract_dir = "doomgeneric-e257a09527062bfb986b6e5e0780839b6cbd5b71/chocolate-doom"

[dependencies]
host = ["make"]

[build]
system = "custom"
toolchain = "c"

[build.steps]
build = [
    "make -j${JOBS} -C doomgeneric -f ${FILES}/Makefile.freepascalos PLATFORM_DIRECTORY=${FILES} CHOCOLATE_DOOM_DIRECTORY=../chocolate-doom/chocolate-doom-chocolate-doom-3.1.1 CC=\"$CC\" CFLAGS=\"$CFLAGS\" LDFLAGS=\"$LDFLAGS\"",
]
install = [
    "mkdir -p ${STAGE}${PREFIX}/bin ${STAGE}${PREFIX}/app/doom",
    "install -m 0755 doomgeneric/doom ${STAGE}${PREFIX}/bin/doom",
    # The Start menu lists the programs of /usr/local/app as it does
    # /app's: the folder holds the description and the program (a link
    # to the one on PATH).
    "install -m 0644 ${FILES}/program.info ${STAGE}${PREFIX}/app/doom/program.info",
    "ln -s ../../bin/doom ${STAGE}${PREFIX}/app/doom/doom",
]

[install]
files = [{ from = "port:files/README.FreePascalOS", to = "share/doc/doomgeneric/README.FreePascalOS", mode = "0644" }]
docs = ["README.md"]

[test]
system = ["test -x /usr/local/bin/doom", "test -f /usr/local/app/doom/program.info"]
